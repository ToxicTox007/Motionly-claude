name: Deploy signed Compose release to Azure VM

on:
  workflow_run:
    workflows: [Supply chain]
    types: [completed]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: compose-vm-deploy-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish-and-stage:
    name: Publish signed bundle and stage on the VM
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_ID: ${{ github.event.workflow_run.head_sha }}
      STORAGE_ACCOUNT: ${{ vars.AZURE_RELEASE_STORAGE_ACCOUNT }}
      STORAGE_CONTAINER: motionly-releases
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      VM_NAME: ${{ vars.AZURE_VM_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download signed manifest from the successful supply-chain run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: release-manifest-${{ github.event.workflow_run.head_sha }}
          path: release-artifacts
      - name: Validate the signed archive-bound release inputs before upload
        run: |
          set -euo pipefail
          python scripts/release/generate_release_manifest.py \
            --validate release-artifacts/release-manifest.json
          python scripts/release/generate_release_manifest.py \
            --validate-bundle \
            --manifest release-artifacts/release-manifest.json \
            --bundle release-artifacts/release-bundle.tar.gz
      - name: Log in to Azure using GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Upload immutable signed release inputs using Azure RBAC
        run: |
          set -euo pipefail
          az storage container create --auth-mode login --account-name "$STORAGE_ACCOUNT" --name "$STORAGE_CONTAINER" --fail-on-exist false --only-show-errors
          # The archive is uploaded first.  The signed manifest is the immutable
          # publication marker and is written last, so an agent never accepts a
          # partially published release.
          az storage blob upload --auth-mode login --account-name "$STORAGE_ACCOUNT" --container-name "$STORAGE_CONTAINER" --name "$RELEASE_ID/release-bundle.tar.gz" --file release-artifacts/release-bundle.tar.gz --overwrite false --only-show-errors
          az storage blob upload --auth-mode login --account-name "$STORAGE_ACCOUNT" --container-name "$STORAGE_CONTAINER" --name "$RELEASE_ID/release-manifest.pem" --file release-artifacts/release-manifest.pem --overwrite false --only-show-errors
          az storage blob upload --auth-mode login --account-name "$STORAGE_ACCOUNT" --container-name "$STORAGE_CONTAINER" --name "$RELEASE_ID/release-manifest.sig" --file release-artifacts/release-manifest.sig --overwrite false --only-show-errors
          az storage blob upload --auth-mode login --account-name "$STORAGE_ACCOUNT" --container-name "$STORAGE_CONTAINER" --name "$RELEASE_ID/release-manifest.json" --file release-artifacts/release-manifest.json --overwrite false --only-show-errors
      - name: Ask the managed-identity host agent to preflight the release
        run: >-
          az vm run-command invoke
          --resource-group "$RESOURCE_GROUP"
          --name "$VM_NAME"
          --command-id RunShellScript
          --scripts "sudo /opt/motionly/agent/bin/apply-release --release-id '$RELEASE_ID' --preflight"
          --only-show-errors

  deploy-production:
    name: Deploy approved release on the Azure VM
    needs: [publish-and-stage]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
    env:
      RELEASE_ID: ${{ github.event.workflow_run.head_sha }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      VM_NAME: ${{ vars.AZURE_VM_NAME }}
    steps:
      - name: Log in to Azure using GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Apply the approved release through the managed-identity host agent
        run: >-
          az vm run-command invoke
          --resource-group "$RESOURCE_GROUP"
          --name "$VM_NAME"
          --command-id RunShellScript
          --scripts "sudo /opt/motionly/agent/bin/apply-release --release-id '$RELEASE_ID'"
          --only-show-errors
