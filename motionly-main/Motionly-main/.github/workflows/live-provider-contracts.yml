name: Live Provider Contracts

# NOTE: 3 consecutive clean weekly or scheduled runs are required before GA,
# or a caveat must be recorded if not yet completed.

on:
  workflow_dispatch:
    inputs:
      authorize_external_provider_contracts:
        description: Run approved provider contracts with sandbox-scoped credentials
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  PNPM_VERSION: 9.15.4
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"

jobs:
  live-contracts:
    if: inputs.authorize_external_provider_contracts == true
    runs-on: ubuntu-latest
    environment: external-provider-verification
    env:
      LIVE_PROVIDER_CONTRACTS: "true"
      EXTERNAL_VERIFICATION_AUTHORIZATION: ${{ secrets.EXTERNAL_VERIFICATION_AUTHORIZATION }}
      EXTERNAL_VERIFICATION_TARGET: staging-sandbox
      EXTERNAL_VERIFICATION_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check './apps/api[dev]'
      - name: Run live provider contracts
        run: |
          cd apps/api
          OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
          GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
          RUNWAY_API_KEY="${{ secrets.RUNWAY_API_KEY }}" \
          PEXELS_API_KEY="${{ secrets.PEXELS_API_KEY }}" \
          PIXABAY_API_KEY="${{ secrets.PIXABAY_API_KEY }}" \
          APP_ENV=test python -m pytest -v tests/test_provider_contracts.py
