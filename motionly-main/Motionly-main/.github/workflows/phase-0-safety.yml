name: Phase 0 safety checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  renderer-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build renderer worker image
        run: docker build --file apps/worker/Dockerfile --tag motionly-renderer-test .
      - name: Prove timeline edits change encoded Remotion output
        run: >-
          docker run --rm
          --env BROWSER_EXECUTABLE_PATH=/usr/bin/chromium
          motionly-renderer-test
          sh -lc "cd /app/apps/renderer && pnpm test:encoded"

  api-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API container
        run: docker build --file apps/api/Dockerfile .

  empty-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.104.0
      - name: Start empty local Supabase
        run: >-
          supabase start --exclude
          gotrue,edge-runtime,imgproxy,kong,logflare,mailpit,postgres-meta,postgrest,realtime,storage-api,studio,supavisor,vector
      - name: Apply every migration and seed from scratch
        run: supabase db reset --local
      - name: Verify final schema contract
        run: supabase test db

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the current repository without exposing findings
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          zricethezav/gitleaks:v8.24.2
          detect --source=/repo --no-git --redact --exit-code=1

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Scan production JavaScript dependencies
        run: pnpm audit --prod --audit-level low
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan API Python dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip pip-audit .
          python -m pip_audit .

  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Run web authorization and editor security tests
        run: pnpm --filter @motionly/web test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run API security and publishing tests
        working-directory: apps/api
        run: |
          python -m pip install '.[dev]'
          python -m pytest -q tests/test_phase6_security.py tests/test_publishing.py tests/test_auth_projects_storage.py
