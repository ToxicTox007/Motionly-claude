# Client authentication for the postgres and temporal-postgres containers
# (database audit DB-21). Mounted read-only and selected with -c hba_file in
# infra/docker-compose.gpu.yml; it replaces the image's pg_hba.conf, which
# accepted unencrypted password logins from any address.
#
# First matching line wins.

# Inside the container (unix socket and loopback): the image's own rules. The
# entrypoint, healthchecks, WAL-G base backups (scripts/deploy/db_backup.sh)
# and the db-roles one-shot (network_mode service:postgres) rely on them.
local   all  supabase_admin               scram-sha-256
local   all  all                          peer map=supabase_map
host    all  all            127.0.0.1/32  trust
host    all  all            ::1/128       trust

# Supabase Realtime's self-hosted tenant connection cannot use TLS: the
# realtime-dev tenant it seeds on every start pins ssl_enforced=false. Its own
# metadata connection does use TLS (DB_SSL). Only this role keeps a password
# login without TLS, and only on the Supabase database.
host    postgres  supabase_admin  0.0.0.0/0  scram-sha-256

# Everything else must use TLS (clients verify the server certificate).
hostssl all  all            0.0.0.0/0     scram-sha-256
hostssl all  all            ::/0          scram-sha-256
