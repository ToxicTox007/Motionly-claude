# Client authentication for the temporal-postgres container (database audit
# DB-21). Same as pg_hba.conf without its Realtime exception: every login from
# another container (temporal-db-init, temporal-schema, temporal) uses TLS.
#
# First matching line wins.

# Inside the container (unix socket and loopback): the image's own rules.
local   all  supabase_admin               scram-sha-256
local   all  all                          peer map=supabase_map
host    all  all            127.0.0.1/32  trust
host    all  all            ::1/128       trust

hostssl all  all            0.0.0.0/0     scram-sha-256
hostssl all  all            ::/0          scram-sha-256
