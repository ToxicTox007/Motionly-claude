# CPU-stage overlay. Apply on top of the production topology:
#
#   docker compose --project-name motionly-cpu-stage --env-file <generated> \
#     -f infra/docker-compose.gpu.yml -f infra/docker-compose.cpu-stage.yml \
#     --profile slim|full up -d --wait
#
# Images come from this checkout (scripts/verify/cpu_stage_stack.py build) and
# the env file and secrets are generated per run
# (scripts/release/write_compose_test_env.py --cpu-stage). The GPU services
# need `--profile gpu` and are never started here. GPU-dependent capabilities
# run as labelled deterministic test fixtures (ML_EXECUTION_MODE=test_fixture),
# and external AI/media providers use their fixture providers. Production
# refuses every one of these settings.
#
# Sizes: `slim` runs one CPU worker for every Python queue (fits a 2-CPU / 7 GB
# machine); `full` runs each production CPU worker service plus
# cpu-fixture-worker for the queues the GPU services serve in production.
name: motionly-cpu-stage

x-cpu-stage-environment: &cpu-stage-environment
  APP_ENV: cpu-stage
  # The CPU stage exercises the billing surface with no real charges.
  BILLING_MODE: demo
  ML_EXECUTION_MODE: test_fixture
  ALLOW_FIXTURE_PROVIDERS: "true"
  # Fake planning and transcription routes (plan Task 26), valid for APP_ENV=
  # cpu-stage: the registry is the only source of inference routes, so the stage
  # serves both required capabilities with no vendor key and no network. Served
  # read-only from the ai-registry volume the base topology mounts.
  AI_REGISTRY_FILE: /opt/motionly/ai-registry/cpu-stage.json
  VISUAL_PROVIDER: fixture
  STEM_SEPARATION_PROVIDER: fixture
  STOCK_VIDEO_PROVIDER: fixture
  # Audio intelligence models (pyannote, wav2vec, YAMNet) ship only in the ML
  # images; the CPU stage runs without them.
  AUDIO_ML_PROVIDER: disabled
  FFMPEG_GPU_ENABLED: "false"
  MODEL_PREFETCH: "false"

services:
  volume-permissions:
    mem_limit: 64m

  postgres:
    mem_limit: 1024m

  temporal-postgres:
    mem_limit: 512m

  temporal-db-init:
    mem_limit: 128m

  temporal-schema:
    mem_limit: 256m

  temporal:
    mem_limit: 768m

  temporal-namespace:
    mem_limit: 256m

  redis:
    mem_limit: 256m

  supabase-auth:
    mem_limit: 256m
    environment:
      # Short-lived tokens, so the browser suite sees them expire and renew
      # (apps/web/tests/browser/session.spec.mjs). They must outlive the web
      # proxy's renewal margin (lib/supabase/session-renewal.mjs, 120 s).
      GOTRUE_JWT_EXP: "150"
      # Every browser test is one viewer behind the CDN simulator, and short
      # tokens renew often: raise the per-viewer limit on /token (default
      # 150 per 5 minutes) so the suite is not throttled.
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "600"

  supabase-rest:
    mem_limit: 256m

  supabase-storage:
    mem_limit: 512m

  supabase-realtime:
    # Elixir BEAM VM; one tenant, no load in the CPU stage.
    mem_limit: 512m
    cpus: 1.0

  supabase-gateway:
    mem_limit: 512m

  db-migrate:
    mem_limit: 256m

  api:
    environment:
      <<: *cpu-stage-environment
      # Every browser test is one viewer behind the CDN simulator, and many
      # sign up: raise the per-viewer limit (production: 5 per hour).
      SIGNUP_RATE_LIMIT_PER_HOUR: "500"
      SIGNUP_GLOBAL_RATE_LIMIT_PER_HOUR: "1000"
      # Billing runs through the demo payment gateway (demo-billing profile).
      BILLING_ENABLED: "true"
      MOCK_GATEWAY_BASE_URL: http://payment-gateway:8010
      # Checkout pages live at <public origin>/pay/checkout/ (the edge routes
      # /pay/* to the gateway); the web app only follows checkout URLs there.
      MOCK_GATEWAY_PUBLIC_BASE_URL: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required for the CPU stage}
      MERCHANT_API_KEY_FILE: /run/secrets/merchant_api_key
      MOCK_GATEWAY_WEBHOOK_SECRET_FILE: /run/secrets/mock_gateway_webhook_secret
    secrets: [merchant_api_key, mock_gateway_webhook_secret]
    mem_limit: 1024m

  temporal-dispatcher:
    environment: *cpu-stage-environment
    mem_limit: 384m

  temporal-worker:
    environment: *cpu-stage-environment
    mem_limit: 512m

  workflow-reconciler:
    environment: *cpu-stage-environment
    mem_limit: 384m

  web:
    environment:
      # A plain-HTTP loopback origin is valid only outside production.
      APP_ENV: cpu-stage
      BILLING_MODE: demo
    mem_limit: 512m

  ingress:
    # The guarded origin. Bound to loopback so the stack checker can prove that
    # requests which bypass the edge (no origin secret) are refused.
    ports: !override
      - "127.0.0.1:18080:80"
    volumes: !override
      - ./Caddyfile.cpu-stage:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.routes:/etc/caddy/routes.caddy:ro
      - ./Caddyfile.origin-guard:/etc/caddy/origin-guard.caddy:ro
      - ./caddy-entrypoint.sh:/etc/caddy/caddy-entrypoint.sh:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m

  # CloudFront simulator: TEST INFRASTRUCTURE, not CloudFront. It applies
  # infra/aws/edge-contract.json in front of the ingress, with HTTPS from a
  # per-run test CA (edge_ca_cert in the generated secrets directory). Viewers
  # use https://127.0.0.1:18443; http://127.0.0.1:18081 redirects to it.
  edge:
    image: node:24-bookworm-slim@sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20
    restart: unless-stopped
    command: ["node", "/opt/cdn-sim/main.mjs"]
    user: "1000:1000"
    read_only: true
    environment:
      CDN_SIM_CONTRACT: /opt/edge-contract.json
      CDN_SIM_ORIGIN: http://ingress:80
      CDN_SIM_TLS_CERT: /run/secrets/edge_tls_cert
      CDN_SIM_TLS_KEY: /run/secrets/edge_tls_key
      CDN_SIM_SECRETS_DIR: /run/secrets
      CDN_SIM_HTTPS_PORT: "8443"
      CDN_SIM_HTTP_PORT: "8080"
      CDN_SIM_PUBLIC_HTTPS_PORT: "18443"
    secrets: [edge_origin_verify, edge_tls_cert, edge_tls_key]
    volumes:
      - ../scripts/cdn-sim:/opt/cdn-sim:ro
      - ./aws/edge-contract.json:/opt/edge-contract.json:ro
    ports:
      - "127.0.0.1:18443:8443"
      - "127.0.0.1:18081:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(8443,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on: [ingress]
    networks: [ingress]
    mem_limit: 128m

  remotion-worker:
    environment: *cpu-stage-environment
    mem_limit: 2048m

  # Mock payment gateway (Task 22). A separate, demo-only UPI + card gateway
  # (prices in INR) that never moves money. It is built from the API image but
  # runs its own process (`python -m app.mock_gateway`), owns the mock_gateway
  # DB schema + role, and has its own webhook signing secret. It refuses to
  # start in production unless BILLING_MODE=demo. Behind the `demo-billing`
  # profile so the base `slim`/`full` stacks do not pay for it unless asked;
  # Caddy routes /pay/* here (infra/Caddyfile.routes). No ports are published:
  # it is reached only through the ingress like every other upstream.
  payment-gateway:
    profiles: [demo-billing]
    image: ${MOTIONLY_API_IMAGE:?MOTIONLY_API_IMAGE must be a digest-pinned GHCR image}
    restart: unless-stopped
    command: ["python", "-m", "app.mock_gateway"]
    environment:
      APP_ENV: cpu-stage
      BILLING_MODE: demo
      MOCK_GATEWAY_HOST: 0.0.0.0
      MOCK_GATEWAY_PORT: "8010"
      MOCK_GATEWAY_BASE_PATH: /pay
      MERCHANT_API_KEY_FILE: /run/secrets/merchant_api_key
      MOCK_GATEWAY_WEBHOOK_SECRET_FILE: /run/secrets/mock_gateway_webhook_secret
      # Persist to the private `mock_gateway` schema through the shared PostgREST
      # using the gateway's OWN role JWT (role claim mock_gateway_role) + the
      # Accept/Content-Profile: mock_gateway headers the store sets. The JWT is
      # mounted only here. Idempotency keys + webhook event ids survive restarts
      # via their UNIQUE constraints.
      MOCK_GATEWAY_POSTGREST_URL: http://supabase-rest:3000/rest/v1
      MOCK_GATEWAY_DB_JWT_FILE: /run/secrets/mock_gateway_db_key
      MOCK_GATEWAY_DB_SCHEMA: mock_gateway
      # Deliver webhooks to the API over the private app network. Inside Docker
      # the API is reached directly (no ingress), so there is NO /api prefix:
      # the receiver route is /billing/webhooks/mock-gateway.
      MOCK_GATEWAY_WEBHOOK_URL: http://api:8000/billing/webhooks/mock-gateway
      # A short renewal period so the browser/stack checks can watch a renewal.
      MOCK_GATEWAY_RENEWAL_PERIOD_SECONDS: "5"
    secrets:
      [merchant_api_key, mock_gateway_webhook_secret, mock_gateway_db_key]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8010/health', timeout=5)",
        ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [app]
    mem_limit: 256m

  # --- full: the production CPU worker services -------------------------------
  cpu-ffmpeg-worker:
    profiles: [full]
    environment: *cpu-stage-environment
    mem_limit: 1024m

  demucs-worker:
    profiles: [full]
    environment: *cpu-stage-environment
    mem_limit: 768m

  provider-worker:
    profiles: [full]
    environment: *cpu-stage-environment
    mem_limit: 768m

  planning-worker:
    profiles: [full]
    environment: *cpu-stage-environment
    mem_limit: 768m

  # Serves the queues that gpu-inference-worker and matte-worker serve in
  # production, with labelled test fixtures only.
  cpu-fixture-worker:
    extends: { file: docker-compose.gpu.yml, service: cpu-ffmpeg-worker }
    profiles: [full]
    environment:
      <<: *cpu-stage-environment
      WORKER_QUEUES: visual_analysis,transcription,matte_extraction
      WORKER_CONCURRENCY: "1"
    mem_limit: 768m

  # --- slim: one CPU worker for every Python queue ----------------------------
  cpu-worker:
    extends: { file: docker-compose.gpu.yml, service: cpu-ffmpeg-worker }
    profiles: [slim]
    environment:
      <<: *cpu-stage-environment
      WORKER_QUEUES: upload_preprocess,render,transcription,visual_analysis,matte_extraction,planning,stock_search,stock_asset_enrichment,audio,intelligence,maintenance,audio_demucs,provider_calls
      WORKER_CONCURRENCY: "2"
    mem_limit: 1536m

secrets:
  edge_tls_cert:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/edge_tls_cert
  edge_tls_key:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/edge_tls_key
  # Mock payment gateway (Task 22, demo-billing profile).
  merchant_api_key:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/merchant_api_key
  mock_gateway_webhook_secret:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/mock_gateway_webhook_secret
  # The gateway's own PostgREST role JWT (role claim mock_gateway_role), mounted
  # only into payment-gateway — like Task 18's supabase_worker_key.
  mock_gateway_db_key:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/mock_gateway_db_key
