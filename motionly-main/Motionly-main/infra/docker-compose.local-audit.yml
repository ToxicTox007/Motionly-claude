# Isolated local-audit overlay. Use only after the plan-only capability report is
# ready, with the base and development Compose files. It never uses release
# domains, production images, a global cleanup command, or repository secrets.
name: motionly-local-audit

x-local-audit-environment: &local-audit-environment
  APP_ENV: local
  FORCE_LOCAL_MEDIA_STORAGE: "true"
  LOCAL_AUDIT_MODE: "true"
  LOCAL_AUDIT_EXTERNAL_EFFECTS_ENABLED: ${LOCAL_AUDIT_EXTERNAL_EFFECTS_ENABLED:-false}
  LOCAL_AUDIT_EXTERNAL_AUTHORIZATION_FILE: /run/secrets/local_audit_external_authorization
  LOCAL_AUDIT_TARGET: "${LOCAL_AUDIT_TARGET:?LOCAL_AUDIT_TARGET must be a sandbox target}"
  LOCAL_AUDIT_RUN_ID: "${LOCAL_AUDIT_RUN_ID:?LOCAL_AUDIT_RUN_ID must identify this audit run}"
  LOCAL_AUDIT_PROVIDER_ACCOUNTS: "${LOCAL_AUDIT_PROVIDER_ACCOUNTS:?LOCAL_AUDIT_PROVIDER_ACCOUNTS must list named sandbox accounts}"
  LOCAL_AUDIT_APPROVED_DOMAINS: "${LOCAL_AUDIT_APPROVED_DOMAINS:?LOCAL_AUDIT_APPROVED_DOMAINS must list exact hosts}"
  LOCAL_AUDIT_MAX_PER_RUN_SPEND_USD: "${LOCAL_AUDIT_MAX_PER_RUN_SPEND_USD:?LOCAL_AUDIT_MAX_PER_RUN_SPEND_USD is required}"
  LOCAL_AUDIT_MAX_TOTAL_SPEND_USD: "${LOCAL_AUDIT_MAX_TOTAL_SPEND_USD:?LOCAL_AUDIT_MAX_TOTAL_SPEND_USD is required}"
  LOCAL_AUDIT_REMOTE_CLEANUP_OWNER: "${LOCAL_AUDIT_REMOTE_CLEANUP_OWNER:?LOCAL_AUDIT_REMOTE_CLEANUP_OWNER is required}"
  LOCAL_AUDIT_REMOTE_CLEANUP_REFERENCE: "${LOCAL_AUDIT_REMOTE_CLEANUP_REFERENCE:?LOCAL_AUDIT_REMOTE_CLEANUP_REFERENCE is required}"
  LOCAL_AUDIT_REMOTE_CLEANUP_POLICY: "${LOCAL_AUDIT_REMOTE_CLEANUP_POLICY:?LOCAL_AUDIT_REMOTE_CLEANUP_POLICY must delete remote artifacts}"

services:
  volume-permissions:
    profiles: [local-audit]

  db-tls:
    profiles: [local-audit]

  postgres:
    profiles: [local-audit]

  db-roles:
    profiles: [local-audit]

  temporal-postgres:
    profiles: [local-audit]

  temporal-db-init:
    profiles: [local-audit]

  temporal-schema:
    profiles: [local-audit]

  temporal:
    profiles: [local-audit]
    image: motionly-temporal-server:local-audit
    build:
      context: ..
      dockerfile: infra/temporal/server/Dockerfile

  temporal-namespace:
    profiles: [local-audit]

  redis:
    profiles: [local-audit]

  supabase-auth:
    profiles: [local-audit]

  supabase-rest:
    profiles: [local-audit]

  supabase-storage:
    profiles: [local-audit]

  supabase-realtime:
    profiles: [local-audit]

  supabase-gateway:
    profiles: [local-audit]

  db-migrate:
    profiles: [local-audit]

  api:
    profiles: [local-audit]
    environment:
      <<: *local-audit-environment
      PROCESS_ROLE: api
    secrets:
      - local_audit_external_authorization

  temporal-dispatcher:
    profiles: [local-audit]
    environment:
      APP_ENV: local

  temporal-worker:
    profiles: [local-audit]
    environment:
      APP_ENV: local

  workflow-reconciler:
    profiles: [local-audit]
    environment:
      APP_ENV: local

  web:
    profiles: [local-audit]
    environment:
      # The audit origin is a local host name, valid only outside production.
      APP_ENV: local

  ingress:
    profiles: [local-audit]
    # Reached directly on loopback, without CloudFront: no origin guard.
    entrypoint: ["caddy"]
    command:
      ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    secrets: !reset []
    ports: !override
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18443:443"
    volumes: !override
      - ./Caddyfile.local-audit:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.routes:/etc/caddy/routes.caddy:ro
      - caddy-data:/data
      - caddy-config:/config

  cpu-ffmpeg-worker:
    profiles: [local-audit]
    environment:
      <<: *local-audit-environment
    secrets:
      - local_audit_external_authorization

  gpu-inference-worker:
    profiles: [local-audit]
    environment:
      <<: *local-audit-environment
    secrets:
      - local_audit_external_authorization

  matte-worker:
    profiles: [local-audit]
    environment:
      <<: *local-audit-environment
    secrets:
      - local_audit_external_authorization

  gpu-ffmpeg-worker:
    profiles: [local-audit]
    environment:
      <<: *local-audit-environment
    secrets:
      - local_audit_external_authorization

  demucs-worker:
    profiles: [local-audit]
    environment:
      <<: *local-audit-environment
    secrets:
      - local_audit_external_authorization

  provider-worker:
    profiles: [local-audit]
    environment:
      <<: *local-audit-environment
    secrets:
      - local_audit_external_authorization

  planning-worker:
    profiles: [local-audit]
    environment:
      <<: *local-audit-environment
    secrets:
      - local_audit_external_authorization

  remotion-worker:
    profiles: [local-audit]
    environment:
      <<: *local-audit-environment
    secrets:
      - local_audit_external_authorization

volumes:
  motionly-media:
    name: motionly-local-audit-media
  motionly-model-cache:
    name: motionly-local-audit-model-cache
  supabase-db:
    name: motionly-local-audit-supabase-db
  temporal-db:
    name: motionly-local-audit-temporal-db
  supabase-storage:
    name: motionly-local-audit-supabase-storage
  redis-data:
    name: motionly-local-audit-redis-data
  caddy-data:
    name: motionly-local-audit-caddy-data
  caddy-config:
    name: motionly-local-audit-caddy-config

secrets:
  local_audit_external_authorization:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the protected local secret directory}/local_audit_external_authorization
