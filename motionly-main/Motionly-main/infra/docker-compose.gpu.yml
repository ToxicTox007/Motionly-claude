x-media-environment: &media-environment
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  SUPABASE_URL: http://supabase-gateway:8000
  SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/supabase_service_role_key
  SUPABASE_JWT_SECRET_FILE: /run/secrets/supabase_jwt_secret
  ADMIN_API_TOKEN_FILE: /run/secrets/admin_api_token
  PUBLISH_TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/publish_token_encryption_key
  APP_ENV: production
  PROCESS_ROLE: worker
  MEDIA_WORK_DIR: /var/data/motionly
  HF_HOME: /var/cache/motionly/huggingface
  TORCH_HOME: /var/cache/motionly/torch
  XDG_CACHE_HOME: /var/cache/motionly
  WORKER_API_BASE_URL: http://api:8000
  GPU_WORKER_INSTANCE_TYPE: ${GPU_WORKER_INSTANCE_TYPE:-g5.xlarge}
  GPU_MAX_CONCURRENT_JOBS_PER_GPU: ${GPU_MAX_CONCURRENT_JOBS_PER_GPU:-1}
  GPU_MEMORY_CEILING_MB: ${GPU_MEMORY_CEILING_MB:-16000}
  GPU_SCALE_UP_QUEUE_DEPTH: ${GPU_SCALE_UP_QUEUE_DEPTH:-4}
  GPU_SCALE_DOWN_QUEUE_DEPTH: ${GPU_SCALE_DOWN_QUEUE_DEPTH:-1}
  GPU_AUTOSCALE_COOLDOWN_SECONDS: ${GPU_AUTOSCALE_COOLDOWN_SECONDS:-300}
  GPU_MAX_WORKER_COUNT: ${GPU_MAX_WORKER_COUNT:-4}
  GPU_OOM_ALERT_THRESHOLD: ${GPU_OOM_ALERT_THRESHOLD:-2}
  GPU_LONG_JOB_TIMEOUT_SECONDS: ${GPU_LONG_JOB_TIMEOUT_SECONDS:-1800}

x-media-volumes: &media-volumes
  - motionly-media:/var/data/motionly
  - motionly-model-cache:/var/cache/motionly

services:
  postgres:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: postgres
    secrets: [postgres_password]
    volumes:
      - supabase-db:/var/lib/postgresql/data
      - ../supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  supabase-auth:
    image: supabase/gotrue:v2.170.0
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@postgres:5432/postgres
      GOTRUE_SITE_URL: https://${APP_DOMAIN}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      API_EXTERNAL_URL: https://${SUPABASE_DOMAIN}

  supabase-rest:
    image: postgrest/postgrest:v12.2.8
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@postgres:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}

  supabase-storage:
    image: supabase/storage-api:v1.14.5
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@postgres:5432/postgres
      FILE_SIZE_LIMIT: 536870912
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
    volumes: [supabase-storage:/var/lib/storage]

  supabase-gateway:
    image: kong:2.8.1
    depends_on: [supabase-auth, supabase-rest, supabase-storage]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
    volumes: [./supabase-kong.yml:/kong/kong.yml:ro]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *media-environment
      PROCESS_ROLE: api
      API_PUBLIC_BASE_URL: https://${API_DOMAIN}
      API_CORS_ORIGINS: https://${APP_DOMAIN}
      SENTRY_DSN: ${SENTRY_DSN}
      WORKER_API_BASE_URL: http://api:8000
    secrets: &app-secrets
      [supabase_service_role_key, supabase_jwt_secret, admin_api_token, publish_token_encryption_key]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    volumes: *media-volumes

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
      NEXT_PUBLIC_API_BASE_URL: https://${API_DOMAIN}
      NEXT_PUBLIC_SUPABASE_URL: https://${SUPABASE_DOMAIN}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    depends_on: [api]

  ingress:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      SUPABASE_DOMAIN: ${SUPABASE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, api, supabase-gateway]

  cpu-ffmpeg-worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile.python
    environment:
      <<: *media-environment
      WORKER_QUEUES: upload_preprocess,render
      WORKER_CONCURRENCY: "2"
    restart: unless-stopped
    volumes: *media-volumes
    secrets: *app-secrets

  gpu-inference-worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile.gpu
    gpus: all
    environment:
      <<: *media-environment
      WORKER_QUEUES: visual_analysis,transcription
      WORKER_CONCURRENCY: "1"
      VISUAL_ANALYSIS_WORKER_CONCURRENCY: "1"
      MODEL_PREFETCH: "true"
    restart: unless-stopped
    volumes: *media-volumes
    secrets: *app-secrets

  matte-worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile.gpu
    gpus: all
    environment:
      <<: *media-environment
      WORKER_QUEUES: matte_extraction
      WORKER_CONCURRENCY: "1"
      MATTE_WORKER_CONCURRENCY: "1"
      MODEL_PREFETCH: "true"
    restart: unless-stopped
    volumes: *media-volumes
    secrets: *app-secrets

  gpu-ffmpeg-worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile.python
    gpus: all
    environment:
      <<: *media-environment
      WORKER_QUEUES: render_gpu
      WORKER_CONCURRENCY: "1"
      FFMPEG_GPU_ENABLED: "true"
      FFMPEG_GPU_ENCODER: h264_nvenc
    restart: unless-stopped
    volumes: *media-volumes
    secrets: *app-secrets

  demucs-worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile.python
      args:
        API_EXTRAS: demucs
    environment:
      <<: *media-environment
      WORKER_QUEUES: audio_demucs
      WORKER_CONCURRENCY: "1"
      MODEL_PREFETCH: "true"
    restart: unless-stopped
    volumes: *media-volumes
    secrets: *app-secrets

  provider-worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile.python
    environment:
      <<: *media-environment
      WORKER_QUEUES: provider_calls
      WORKER_CONCURRENCY: "4"
    restart: unless-stopped
    volumes: *media-volumes
    secrets: *app-secrets

  planning-worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile.python
    environment:
      <<: *media-environment
      WORKER_QUEUES: planning,stock_search,stock_asset_enrichment,audio,intelligence,maintenance
      WORKER_CONCURRENCY: "3"
    restart: unless-stopped
    volumes: *media-volumes
    secrets: *app-secrets

  remotion-worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *media-environment
      WORKER_QUEUES: render_remotion
      REMOTION_ENABLED: "true"
      WORKER_CONCURRENCY: "1"
    restart: unless-stopped
    volumes: *media-volumes
    secrets: *app-secrets

  publishing-worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile.python
    environment:
      <<: *media-environment
      WORKER_QUEUES: publish
      WORKER_CONCURRENCY: "3"
    restart: unless-stopped
    volumes: *media-volumes
    secrets: *app-secrets

volumes:
  motionly-media:
  motionly-model-cache:
  supabase-db:
  supabase-storage:
  redis-data:
  caddy-data:
  caddy-config:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  supabase_service_role_key:
    file: ./secrets/supabase_service_role_key
  supabase_jwt_secret:
    file: ./secrets/supabase_jwt_secret
  admin_api_token:
    file: ./secrets/admin_api_token
  publish_token_encryption_key:
    file: ./secrets/publish_token_encryption_key
