x-worker-depends-on: &worker-depends-on
  api: { condition: service_started }
  db-migrate: { condition: service_completed_successfully }
  volume-permissions: { condition: service_completed_successfully }

x-media-environment: &media-environment
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required for production Compose}@redis:6379/0
  SUPABASE_URL: http://supabase-gateway:8000
  # Browsers reach Supabase on the public origin; signed links they open use it.
  SUPABASE_PUBLIC_URL: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required for production Compose}/supabase
  # S3: workers authenticate to PostgREST as the restricted motionly_worker JWT
  # role, never with the service-role key. PostgREST switches role from the JWT's
  # `role` claim, so this file is a drop-in replacement for the key workers read.
  SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/supabase_worker_key
  SUPABASE_JWT_SECRET_FILE: /run/secrets/supabase_jwt_secret
  WORKER_API_TOKEN_FILE: /run/secrets/worker_api_token
  APP_ENV: production
  PROCESS_ROLE: worker
  MEDIA_WORK_DIR: /var/data/motionly
  HF_HOME: /var/cache/motionly/huggingface
  TORCH_HOME: /var/cache/motionly/torch
  XDG_CACHE_HOME: /var/cache/motionly
  WORKER_API_BASE_URL: http://api:8000
  GPU_WORKER_INSTANCE_TYPE: ${GPU_WORKER_INSTANCE_TYPE:-g5.xlarge}
  GPU_MAX_CONCURRENT_JOBS_PER_GPU: ${GPU_MAX_CONCURRENT_JOBS_PER_GPU:-1}
  GPU_MEMORY_CEILING_MB: ${GPU_MEMORY_CEILING_MB:-16000}
  GPU_SCALE_UP_QUEUE_DEPTH: ${GPU_SCALE_UP_QUEUE_DEPTH:-4}
  GPU_SCALE_DOWN_QUEUE_DEPTH: ${GPU_SCALE_DOWN_QUEUE_DEPTH:-1}
  GPU_AUTOSCALE_COOLDOWN_SECONDS: ${GPU_AUTOSCALE_COOLDOWN_SECONDS:-300}
  GPU_MAX_WORKER_COUNT: ${GPU_MAX_WORKER_COUNT:-4}
  GPU_OOM_ALERT_THRESHOLD: ${GPU_OOM_ALERT_THRESHOLD:-2}
  GPU_LONG_JOB_TIMEOUT_SECONDS: ${GPU_LONG_JOB_TIMEOUT_SECONDS:-1800}
  MODEL_GATEWAY_ENABLED: "true"
  MODEL_GATEWAY_MONTHLY_BUDGET_USD: ${MODEL_GATEWAY_MONTHLY_BUDGET_USD:-100}
  MODEL_GATEWAY_REQUEST_BUDGET_USD: ${MODEL_GATEWAY_REQUEST_BUDGET_USD:-5}
  MODEL_GATEWAY_FAILURE_THRESHOLD: ${MODEL_GATEWAY_FAILURE_THRESHOLD:-3}
  MODEL_GATEWAY_CIRCUIT_COOLDOWN_SECONDS: ${MODEL_GATEWAY_CIRCUIT_COOLDOWN_SECONDS:-60}
  # Declarative inference registry (plan Task 4/Task 26): the only source of
  # inference routes. Mounted read-only; a comma-separated list composes a remote
  # registry with the local fragments. All route secrets come from one bundle.
  AI_REGISTRY_FILE: /opt/motionly/ai-registry/registry.json
  AI_SECRETS_DIR: /run/secrets
  AI_SECRETS_BUNDLE_FILE: /run/secrets/ai_secrets_bundle
  AI_BLOCK_NONCOMMERCIAL: ${AI_BLOCK_NONCOMMERCIAL:-false}
  AI_WORKSPACE_SCOPED_ROUTES: ${AI_WORKSPACE_SCOPED_ROUTES:-false}
  AI_QUOTA_SCOPE: ${AI_QUOTA_SCOPE:-feature}
  # Transcription and planning model ids/revisions, credentials and provider
  # labels come from the registry; only the budget hints stay as settings.
  TRANSCRIPTION_ESTIMATED_COST_PER_REQUEST_USD: ${TRANSCRIPTION_ESTIMATED_COST_PER_REQUEST_USD:-0.25}
  EDIT_PLANNER_INPUT_COST_PER_MILLION_USD: ${EDIT_PLANNER_INPUT_COST_PER_MILLION_USD:-2}
  EDIT_PLANNER_OUTPUT_COST_PER_MILLION_USD: ${EDIT_PLANNER_OUTPUT_COST_PER_MILLION_USD:-2}
  AUDIO_ML_PROVIDER: local_ml
  ALLOW_FIXTURE_PROVIDERS: "false"

x-temporal-environment: &temporal-environment
  TEMPORAL_DEPLOYMENT_MODE: self_hosted
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-motionly}
  TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-motionly-orchestration}
  TEMPORAL_TLS_ENABLED: "true"
  TEMPORAL_SERVER_ROOT_CA_PATH: /run/secrets/temporal_ca_cert
  TEMPORAL_SERVER_NAME: temporal

# Health checks: `compose up --wait` at release time waits for these, so a
# service that never starts or hangs fails the release (tests/test_compose_health_checks.py).
# Workers and orchestration roles refresh a liveness file while they run
# (apps/worker/src/liveness.mjs, app.orchestration.main).
x-worker-healthcheck: &worker-healthcheck
  test:
    - CMD
    - node
    - -e
    - "process.exit(Date.now() - require('fs').statSync('/tmp/motionly-worker-alive').mtimeMs < 120000 ? 0 : 1)"
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 300s

x-orchestration-healthcheck: &orchestration-healthcheck
  test:
    - CMD
    - python
    - -c
    - "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/motionly-orchestration-alive') < 60 else 1)"
  interval: 15s
  timeout: 10s
  retries: 3
  start_period: 60s

x-media-volumes: &media-volumes
  - motionly-media:/var/data/motionly
  - motionly-model-cache:/var/cache/motionly
  # Declarative inference registry, mounted read-only (plan Task 26). The route
  # secrets come from the ai_secrets_bundle secret, never from this directory.
  - ${AI_REGISTRY_DIR:-./ai-registry}:/opt/motionly/ai-registry:ro

services:
  volume-permissions:
    image: alpine:3.21.3@sha256:a8560b36e8b8210634f77d9f7f9efd7ffa463e380b75e2e74aff4511df3ef88c
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    command:
      - sh
      - -ec
      - |
        mkdir -p /var/data/motionly /var/cache/motionly
        chown -R 10001:10001 /var/data/motionly /var/cache/motionly
    volumes: *media-volumes

  postgres:
    image: supabase/postgres:17.4.1.069@sha256:6900ef3bde159491c8774249dfd213926416f716ef0c897897ae4f88e6819c72
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: postgres
    secrets: [postgres_password]
    volumes:
      - supabase-db:/var/lib/postgresql/data
      # The image's own init scripts create the Supabase roles and the auth and
      # storage schemas; only add the role passwords. Migrations run in db-migrate.
      - ./db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      # Realtime migrates into _realtime; it cannot create the schema itself.
      - ./db/realtime.sql:/docker-entrypoint-initdb.d/init-scripts/98-realtime.sql:ro
    networks: [app]
    healthcheck:
      # TCP, not the socket: during first-boot init the image runs a
      # socket-only server, which must not count as ready.
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Temporal persistence is deliberately separate from Supabase PostgreSQL so no
  # application service can join the Temporal persistence network.
  temporal-postgres:
    image: supabase/postgres:17.4.1.069@sha256:6900ef3bde159491c8774249dfd213926416f716ef0c897897ae4f88e6819c72
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: postgres
    secrets: [postgres_password]
    volumes: [temporal-db:/var/lib/postgresql/data]
    networks: [temporal-persistence]
    healthcheck:
      # TCP, not the socket: see postgres above.
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal-db-init:
    image: supabase/postgres:17.4.1.069@sha256:6900ef3bde159491c8774249dfd213926416f716ef0c897897ae4f88e6819c72
    restart: "no"
    entrypoint: ["/bin/sh", "/opt/motionly-temporal/init-postgres.sh"]
    depends_on: { temporal-postgres: { condition: service_healthy } }
    secrets: [postgres_password, temporal_db_password]
    volumes:
      - ./temporal:/opt/motionly-temporal:ro
    networks: [temporal-persistence]

  temporal-schema:
    image: ${TEMPORAL_ADMIN_TOOLS_IMAGE:?TEMPORAL_ADMIN_TOOLS_IMAGE must be a digest-pinned Temporal image}
    restart: "no"
    entrypoint: ["/bin/sh", "/opt/motionly-temporal/apply-schema.sh"]
    depends_on:
      temporal-db-init: { condition: service_completed_successfully }
    secrets: [temporal_db_password]
    volumes:
      - ./temporal:/opt/motionly-temporal:ro
    networks: [temporal-persistence]

  temporal:
    image: ${MOTIONLY_TEMPORAL_SERVER_IMAGE:?MOTIONLY_TEMPORAL_SERVER_IMAGE must be a digest-pinned GHCR custom Temporal image}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/motionly-temporal/start-server.sh"]
    environment:
      MOTIONLY_TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-motionly}
      MOTIONLY_TEMPORAL_BOOTSTRAP_ADMIN_UNTIL: ${TEMPORAL_BOOTSTRAP_ADMIN_UNTIL:?TEMPORAL_BOOTSTRAP_ADMIN_UNTIL must be a short-lived RFC3339 timestamp}
    depends_on:
      temporal-schema: { condition: service_completed_successfully }
    secrets:
      [
        temporal_db_password,
        temporal_ca_cert,
        temporal_server_cert,
        temporal_server_key,
        temporal_internode_cert,
        temporal_internode_key,
        temporal_diagnostics_cert,
        temporal_diagnostics_key,
      ]
    volumes:
      - ./temporal:/opt/motionly-temporal:ro
    networks: [temporal-control, temporal-persistence]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "temporal operator cluster health --address 127.0.0.1:7233 --tls --tls-ca-path /run/secrets/temporal_ca_cert --tls-cert-path /run/secrets/temporal_diagnostics_cert --tls-key-path /run/secrets/temporal_diagnostics_key --tls-server-name temporal",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  temporal-namespace:
    image: ${TEMPORAL_ADMIN_TOOLS_IMAGE:?TEMPORAL_ADMIN_TOOLS_IMAGE must be a digest-pinned Temporal image}
    restart: "no"
    entrypoint: ["/bin/sh", "/opt/motionly-temporal/bootstrap-namespace.sh"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_SERVER_NAME: temporal
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-motionly}
      TEMPORAL_NAMESPACE_RETENTION: ${TEMPORAL_NAMESPACE_RETENTION:-7d}
    depends_on:
      temporal: { condition: service_healthy }
    secrets:
      [
        temporal_ca_cert,
        temporal_namespace_bootstrap_cert,
        temporal_namespace_bootstrap_key,
      ]
    volumes:
      - ./temporal:/opt/motionly-temporal:ro
    networks: [temporal-control]

  redis:
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    # Redis has no *_FILE option for requirepass.  Build an ephemeral local
    # config from the mounted secret so the password never appears in argv.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf 'requirepass %s\nappendonly yes\n' "$(cat /run/secrets/redis_password)" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    secrets: [redis_password]
    volumes: [redis-data:/data]
    networks: [app]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  supabase-auth:
    image: supabase/gotrue:v2.170.0@sha256:0cfa54e096dcae4ed30162811fa8794f7c443708c41973329e07f7d44c1cc3e7
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production Compose}@postgres:5432/postgres
      GOTRUE_SITE_URL: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required for production Compose}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET is required for production Compose}
      # Tokens must say aud and role "authenticated": the API checks the
      # audience, PostgREST switches to the role, and sign-in looks users up by
      # audience. GoTrue's defaults are empty.
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      # Auth rate-limits per viewer: the ingress sets this header from
      # CloudFront-Viewer-Address (infra/Caddyfile.origin-guard) and the web
      # server passes it on. Without it GoTrue applies no per-IP limits.
      GOTRUE_RATE_LIMIT_HEADER: X-Motionly-Viewer-IP
      # No email: Auth's public sign-up is off. Accounts are created, already
      # confirmed, by the API's rate-limited POST /auth/signup through the
      # admin API, and admins hand out password-reset links (Tasks 11-12).
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: "8"
      # Admin-issued recovery links (Task 12) live for one hour, then GoTrue
      # returns otp_expired. This bounds a leaked link's usefulness.
      GOTRUE_MAILER_OTP_EXP: "3600"
      API_EXTERNAL_URL: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required for production Compose}/supabase
    # Auth migrates the auth schema before it serves /health.
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:9999/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [app]

  supabase-rest:
    image: postgrest/postgrest:v12.2.8@sha256:e5978740a590628f2114730bb942f35342ea70b8b7a86697a3df283c0caea109
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production Compose}@postgres:5432/postgres
      # `mock_gateway` is served for the payment gateway's own role only: the
      # gateway presents a mock_gateway_role JWT + Accept/Content-Profile:
      # mock_gateway. anon/authenticated/service_role have every privilege on
      # that schema revoked (supabase/migrations/202610190801), so exposing it
      # here does not widen their reach.
      PGRST_DB_SCHEMAS: public,storage,graphql_public,mock_gateway
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET is required for production Compose}

    networks: [app]

  supabase-storage:
    image: supabase/storage-api:v1.14.5@sha256:ee0826bde4966c4cb70b79605ea5197d708dfa6ceeee7f427c4cad8b539ffda3
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required for production Compose}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required for production Compose}
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET is required for production Compose}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production Compose}@postgres:5432/postgres
      FILE_SIZE_LIMIT: 536870912
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      # The file backend stores objects under <path>/<GLOBAL_S3_BUCKET>/; unset,
      # objects land in an "undefined" folder and deletes fail.
      GLOBAL_S3_BUCKET: motionly-media
    volumes: [supabase-storage:/var/lib/storage]
    # Storage migrates the storage schema before it serves /status.
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:5000/status",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [app]

  # Supabase Realtime (Elixir/Phoenix). Private channels only: clients join
  # `workspace:<id>` / `project:<id>` topics, authorized by Row Level Security
  # on realtime.messages (supabase/migrations/202610191101). Realtime creates
  # its own `realtime` and `_realtime` schemas at startup by running its
  # migrations against Postgres, so db-migrate waits for it to be healthy before
  # attaching the channel policies. Kong routes it as realtime-dev tenant at
  # /supabase/realtime/v1 (WebSocket and REST). No ports: reached only through
  # the ingress like every other Supabase upstream.
  supabase-realtime:
    image: supabase/realtime:v2.78.10@sha256:8720d206683918b18341010107264993a07910cc80f9bcff1f7f5ab3e9bdf1c7
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    entrypoint:
      # Realtime has no *_FILE options; read the per-process secrets from their
      # mounted files into the environment, then hand off to the image's own
      # entrypoint. The secret values never appear in argv or in `compose config`.
      - /bin/sh
      - -ec
      - |
        export DB_PASSWORD="$(cat /run/secrets/postgres_password)"
        export DB_ENC_KEY="$(cat /run/secrets/realtime_db_enc_key)"
        export API_JWT_SECRET="$(cat /run/secrets/supabase_jwt_secret)"
        export SECRET_KEY_BASE="$(cat /run/secrets/realtime_secret_key_base)"
        # Signs the tokens Realtime's own /metrics endpoint accepts; the
        # release refuses to boot without it.
        export METRICS_JWT_SECRET="$(cat /run/secrets/realtime_metrics_jwt_secret)"
        # Hand off to the image's own entrypoint and command: it migrates,
        # seeds the realtime-dev tenant (SEED_SELF_HOST) and applies RLIMIT_NOFILE.
        exec /usr/bin/tini -s -g -- /app/run.sh /app/bin/server
    environment:
      PORT: "4000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_NAME: postgres
      # Realtime keeps its own state under the _realtime schema.
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      APP_NAME: realtime
      # Self-hosted single-tenant mode seeds the `realtime-dev` tenant so Kong
      # can route to it; the janitor prunes expired realtime.messages rows.
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      ERL_AFLAGS: "-proto_dist inet_tcp"
      DNS_NODES: "''"
      RLIMIT_NOFILE: "100000"
    secrets:
      [
        postgres_password,
        supabase_jwt_secret,
        realtime_db_enc_key,
        realtime_secret_key_base,
        realtime_metrics_jwt_secret,
      ]
    healthcheck:
      # Realtime answers /api/ping for the seeded realtime-dev tenant (named by
      # the Host header, as Kong sends it) once its migrations and seed have run.
      # The image ships curl, not wget.
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--output",
          "/dev/null",
          "--header",
          "Host: realtime-dev.supabase-realtime",
          "http://127.0.0.1:4000/api/ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      app:
        # Kong routes to the realtime container by this hostname (it matches the
        # self-hosted `realtime-dev` tenant), so the declarative Kong config
        # stays identical to Supabase's own.
        aliases: [realtime-dev.supabase-realtime]

  supabase-gateway:
    image: kong:2.8.1@sha256:1b53405d8680a09d6f44494b7990bf7da2ea43f84a258c59717d4539abf09f6d
    restart: unless-stopped
    depends_on:
      [supabase-auth, supabase-rest, supabase-storage, supabase-realtime]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
    volumes: [./supabase-kong.yml:/kong/kong.yml:ro]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [app]

  # Applies pending migrations on every `docker compose up` (every release),
  # after Auth and Storage have created their schemas. See infra/db/migrate.sh.
  db-migrate:
    image: supabase/postgres:17.4.1.069@sha256:6900ef3bde159491c8774249dfd213926416f716ef0c897897ae4f88e6819c72
    restart: "no"
    entrypoint: ["/bin/sh", "/opt/motionly-db/migrate.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: postgres
    depends_on:
      postgres: { condition: service_healthy }
      supabase-auth: { condition: service_healthy }
      supabase-storage: { condition: service_healthy }
      # Realtime creates the `realtime` schema (incl. realtime.messages) at
      # startup; wait for it so migration 202610191101 can attach the
      # private-channel authorization policies to that table.
      supabase-realtime: { condition: service_healthy }
    secrets: [postgres_password]
    volumes:
      - ../supabase/migrations:/opt/motionly-db/migrations:ro
      - ./db/migrate.sh:/opt/motionly-db/migrate.sh:ro
    networks: [app]

  api:
    image: ${MOTIONLY_API_IMAGE:?MOTIONLY_API_IMAGE must be a digest-pinned GHCR image}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live', timeout=5)",
        ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      <<: [*media-environment, *temporal-environment]
      PROCESS_ROLE: api
      # The shared media environment points workers at their restricted
      # supabase_worker_key (Task 18); the API keeps the service-role key.
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/supabase_service_role_key
      ADMIN_API_TOKEN_FILE: /run/secrets/admin_api_token
      METRICS_BEARER_TOKEN_FILE: /run/secrets/metrics_bearer_token
      TEMPORAL_CLIENT_ROLE: api
      TEMPORAL_IDENTITY: motionly-api
      TEMPORAL_CLIENT_CERT_PATH: /run/secrets/temporal_api_cert
      TEMPORAL_CLIENT_PRIVATE_KEY_PATH: /run/secrets/temporal_api_key
      API_PUBLIC_BASE_URL: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required for production Compose}/api
      API_CORS_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required for production Compose}
      BILLING_MODE: ${BILLING_MODE:?BILLING_MODE is required for production Compose (disabled or demo)}
      BILLING_PAST_DUE_GRACE_DAYS: ${BILLING_PAST_DUE_GRACE_DAYS:-7}
      WORKER_API_BASE_URL: http://api:8000
    secrets:
      [
        supabase_service_role_key,
        supabase_jwt_secret,
        worker_api_token,
        admin_api_token,
        ai_secrets_bundle,
        metrics_bearer_token,
        temporal_ca_cert,
        temporal_api_cert,
        temporal_api_key,
      ]
    depends_on:
      volume-permissions: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      db-migrate: { condition: service_completed_successfully }
    volumes: *media-volumes

    networks: [app, temporal-control]

  temporal-dispatcher:
    image: ${MOTIONLY_API_IMAGE:?MOTIONLY_API_IMAGE must be a digest-pinned GHCR image}
    restart: unless-stopped
    healthcheck: *orchestration-healthcheck
    command:
      - python
      - -m
      - app.orchestration.main
      - temporal-dispatcher
    environment:
      <<: *temporal-environment
      APP_ENV: production
      PROCESS_ROLE: temporal-dispatcher
      SUPABASE_URL: http://supabase-gateway:8000
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/supabase_service_role_key
      SUPABASE_JWT_SECRET_FILE: /run/secrets/supabase_jwt_secret
      TEMPORAL_DISPATCHER_ID: compose-dispatcher
      TEMPORAL_CLIENT_ROLE: dispatcher
      TEMPORAL_IDENTITY: motionly-dispatcher
      TEMPORAL_CLIENT_CERT_PATH: /run/secrets/temporal_dispatcher_cert
      TEMPORAL_CLIENT_PRIVATE_KEY_PATH: /run/secrets/temporal_dispatcher_key
    secrets:
      [
        supabase_service_role_key,
        supabase_jwt_secret,
        temporal_ca_cert,
        temporal_dispatcher_cert,
        temporal_dispatcher_key,
      ]
    depends_on:
      temporal-namespace: { condition: service_completed_successfully }
      supabase-gateway: { condition: service_started }
      db-migrate: { condition: service_completed_successfully }

    networks: [app, temporal-control]

  temporal-worker:
    image: ${MOTIONLY_API_IMAGE:?MOTIONLY_API_IMAGE must be a digest-pinned GHCR image}
    restart: unless-stopped
    healthcheck: *orchestration-healthcheck
    command:
      - python
      - -m
      - app.orchestration.main
      - temporal-worker
    environment:
      <<: *temporal-environment
      APP_ENV: production
      PROCESS_ROLE: temporal-worker
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required for production Compose}@redis:6379/0
      SUPABASE_URL: http://supabase-gateway:8000
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/supabase_service_role_key
      SUPABASE_JWT_SECRET_FILE: /run/secrets/supabase_jwt_secret
      WORKER_API_BASE_URL: http://api:8000
      WORKER_API_TOKEN_FILE: /run/secrets/worker_api_token
      TEMPORAL_CLIENT_ROLE: worker
      TEMPORAL_IDENTITY: motionly-temporal-worker
      TEMPORAL_CLIENT_CERT_PATH: /run/secrets/temporal_worker_cert
      TEMPORAL_CLIENT_PRIVATE_KEY_PATH: /run/secrets/temporal_worker_key
    secrets:
      [
        supabase_service_role_key,
        supabase_jwt_secret,
        worker_api_token,
        temporal_ca_cert,
        temporal_worker_cert,
        temporal_worker_key,
      ]
    depends_on:
      temporal-namespace: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      api: { condition: service_started }
      db-migrate: { condition: service_completed_successfully }

    networks: [app, temporal-control]

  workflow-reconciler:
    image: ${MOTIONLY_API_IMAGE:?MOTIONLY_API_IMAGE must be a digest-pinned GHCR image}
    restart: unless-stopped
    healthcheck: *orchestration-healthcheck
    command:
      - python
      - -m
      - app.orchestration.main
      - workflow-reconciler
    environment:
      <<: *temporal-environment
      APP_ENV: production
      PROCESS_ROLE: workflow-reconciler
      SUPABASE_URL: http://supabase-gateway:8000
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/supabase_service_role_key
      SUPABASE_JWT_SECRET_FILE: /run/secrets/supabase_jwt_secret
      TEMPORAL_DISPATCHER_ID: compose-reconciler
      TEMPORAL_CLIENT_ROLE: reconciler
      TEMPORAL_IDENTITY: motionly-reconciler
      TEMPORAL_CLIENT_CERT_PATH: /run/secrets/temporal_reconciler_cert
      TEMPORAL_CLIENT_PRIVATE_KEY_PATH: /run/secrets/temporal_reconciler_key
    secrets:
      [
        supabase_service_role_key,
        supabase_jwt_secret,
        temporal_ca_cert,
        temporal_reconciler_cert,
        temporal_reconciler_key,
      ]
    depends_on:
      temporal-namespace: { condition: service_completed_successfully }
      supabase-gateway: { condition: service_started }
      db-migrate: { condition: service_completed_successfully }

    networks: [app, temporal-control]

  web:
    image: ${MOTIONLY_WEB_IMAGE:?MOTIONLY_WEB_IMAGE must be a digest-pinned GHCR image}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/app-api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Configured at runtime (apps/web/lib/runtime-config.mjs): browsers use
    # PUBLIC_ORIGIN; the server reaches the API and Supabase privately.
    environment:
      APP_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required for production Compose}
      API_INTERNAL_URL: http://api:8000
      SUPABASE_URL: http://supabase-gateway:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required for production Compose}
      BILLING_MODE: ${BILLING_MODE:?BILLING_MODE is required for production Compose (disabled or demo)}
    depends_on: [api, supabase-gateway]

    networks: [app]

  ingress:
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:2019/config/",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    # The CloudFront origin: plain HTTP on port 80, reachable only from
    # CloudFront's address range and refused without the origin secret
    # (infra/aws/edge-contract.json, infra/Caddyfile.origin-guard).
    ports: ["80:80"]
    entrypoint: ["/bin/sh", "/etc/caddy/caddy-entrypoint.sh"]
    command:
      [
        "caddy",
        "run",
        "--config",
        "/etc/caddy/Caddyfile",
        "--adapter",
        "caddyfile",
      ]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required for production Compose}
    secrets: [edge_origin_verify, edge_origin_verify_previous]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.routes:/etc/caddy/routes.caddy:ro
      - ./Caddyfile.origin-guard:/etc/caddy/origin-guard.caddy:ro
      - ./caddy-entrypoint.sh:/etc/caddy/caddy-entrypoint.sh:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, api, supabase-gateway]

    networks: [ingress, app]

  cpu-ffmpeg-worker:
    image: ${MOTIONLY_CPU_FFMPEG_WORKER_IMAGE:?MOTIONLY_CPU_FFMPEG_WORKER_IMAGE must be a digest-pinned GHCR image}
    environment:
      <<: *media-environment
      WORKER_QUEUES: upload_preprocess,render
      WORKER_CONCURRENCY: "2"
    restart: unless-stopped
    healthcheck: *worker-healthcheck
    depends_on: *worker-depends-on
    volumes: *media-volumes
    secrets:
      &worker-secrets [
        supabase_worker_key,
        supabase_jwt_secret,
        worker_api_token,
        ai_secrets_bundle,
      ]

    networks: [app]

  gpu-inference-worker:
    profiles: [gpu]
    image: ${MOTIONLY_GPU_WORKER_IMAGE:?MOTIONLY_GPU_WORKER_IMAGE must be a digest-pinned GHCR image}
    gpus: all
    environment:
      <<: *media-environment
      WORKER_QUEUES: visual_analysis,transcription
      WORKER_CONCURRENCY: "1"
      VISUAL_ANALYSIS_WORKER_CONCURRENCY: "1"
      MODEL_PREFETCH: "true"
    restart: unless-stopped
    healthcheck:
      <<: *worker-healthcheck
      start_period: 900s
    depends_on: *worker-depends-on
    volumes: *media-volumes
    secrets: *worker-secrets

    networks: [app]

  matte-worker:
    profiles: [gpu]
    image: ${MOTIONLY_GPU_WORKER_IMAGE:?MOTIONLY_GPU_WORKER_IMAGE must be a digest-pinned GHCR image}
    gpus: all
    environment:
      <<: *media-environment
      WORKER_QUEUES: matte_extraction
      WORKER_CONCURRENCY: "1"
      MATTE_WORKER_CONCURRENCY: "1"
      MODEL_PREFETCH: "true"
    restart: unless-stopped
    healthcheck:
      <<: *worker-healthcheck
      start_period: 900s
    depends_on: *worker-depends-on
    volumes: *media-volumes
    secrets: *worker-secrets

    networks: [app]

  gpu-ffmpeg-worker:
    profiles: [gpu]
    image: ${MOTIONLY_GPU_FFMPEG_WORKER_IMAGE:?MOTIONLY_GPU_FFMPEG_WORKER_IMAGE must be a digest-pinned GHCR image}
    gpus: all
    environment:
      <<: *media-environment
      WORKER_QUEUES: render_gpu
      WORKER_CONCURRENCY: "1"
      FFMPEG_GPU_ENABLED: "true"
      FFMPEG_GPU_ENCODER: h264_nvenc
    restart: unless-stopped
    healthcheck:
      <<: *worker-healthcheck
      start_period: 900s
    depends_on: *worker-depends-on
    volumes: *media-volumes
    secrets: *worker-secrets

    networks: [app]

  demucs-worker:
    image: ${MOTIONLY_DEMUCS_WORKER_IMAGE:?MOTIONLY_DEMUCS_WORKER_IMAGE must be a digest-pinned GHCR image}
    environment:
      <<: *media-environment
      WORKER_QUEUES: audio_demucs
      WORKER_CONCURRENCY: "1"
      MODEL_PREFETCH: "true"
    restart: unless-stopped
    healthcheck: *worker-healthcheck
    depends_on: *worker-depends-on
    volumes: *media-volumes
    secrets: *worker-secrets

    networks: [app]

  provider-worker:
    image: ${MOTIONLY_PROVIDER_WORKER_IMAGE:?MOTIONLY_PROVIDER_WORKER_IMAGE must be a digest-pinned GHCR image}
    environment:
      <<: *media-environment
      WORKER_QUEUES: provider_calls
      WORKER_CONCURRENCY: "4"
    restart: unless-stopped
    healthcheck: *worker-healthcheck
    depends_on: *worker-depends-on
    volumes: *media-volumes
    secrets: *worker-secrets

    networks: [app]

  planning-worker:
    image: ${MOTIONLY_PLANNING_WORKER_IMAGE:?MOTIONLY_PLANNING_WORKER_IMAGE must be a digest-pinned GHCR image}
    environment:
      <<: *media-environment
      WORKER_QUEUES: planning,stock_search,stock_asset_enrichment,audio,intelligence,maintenance
      WORKER_CONCURRENCY: "3"
    restart: unless-stopped
    healthcheck: *worker-healthcheck
    depends_on: *worker-depends-on
    volumes: *media-volumes
    secrets: *worker-secrets

    networks: [app]

  remotion-worker:
    image: ${MOTIONLY_REMOTION_WORKER_IMAGE:?MOTIONLY_REMOTION_WORKER_IMAGE must be a digest-pinned GHCR image}
    environment:
      <<: *media-environment
      # Chromium receives only loopback URLs from the worker media proxy. Do not
      # inherit host proxy settings that could create an alternate egress path.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: 127.0.0.1,localhost,::1
      WORKER_QUEUES: render_remotion
      REMOTION_ENABLED: "true"
      WORKER_CONCURRENCY: "1"
    restart: unless-stopped
    healthcheck: *worker-healthcheck
    depends_on: *worker-depends-on
    volumes: *media-volumes
    secrets: *worker-secrets

    networks: [app]

volumes:
  motionly-media:
  motionly-model-cache:
  supabase-db:
  temporal-db:
  supabase-storage:
  redis-data:
  caddy-data:
  caddy-config:

secrets:
  postgres_password:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/postgres_password
  redis_password:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/redis_password
  temporal_db_password:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/temporal_db_password
  supabase_service_role_key:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/supabase_service_role_key
  supabase_worker_key:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/supabase_worker_key
  supabase_jwt_secret:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/supabase_jwt_secret
  # Realtime (Task 25): a 16-byte AES key for row encryption and a Phoenix
  # secret-key-base. Generated per deployment like every other host secret.
  realtime_db_enc_key:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/realtime_db_enc_key
  realtime_secret_key_base:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/realtime_secret_key_base
  realtime_metrics_jwt_secret:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/realtime_metrics_jwt_secret
  admin_api_token:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/admin_api_token
  worker_api_token:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/worker_api_token

  # One generic secrets bundle for every registry route (plan Task 26). The
  # registry's ``bundle:<key>`` refs read keys out of this JSON object; no
  # vendor-named secret is mounted.
  ai_secrets_bundle:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/ai_secrets_bundle
  metrics_bearer_token:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/metrics_bearer_token
  # Origin guard (CloudFront custom header); previous is empty outside a rotation.
  edge_origin_verify:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/edge_origin_verify
  edge_origin_verify_previous:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/edge_origin_verify_previous
  temporal_ca_cert:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/temporal_ca_cert
  temporal_server_cert:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/temporal_server_cert
  temporal_server_key:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/temporal_server_key
  temporal_internode_cert:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/temporal_internode_cert
  temporal_internode_key:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/temporal_internode_key
  temporal_api_cert:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/temporal_api_cert
  temporal_api_key:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/temporal_api_key
  temporal_dispatcher_cert:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/temporal_dispatcher_cert
  temporal_dispatcher_key:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/temporal_dispatcher_key
  temporal_worker_cert:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/temporal_worker_cert
  temporal_worker_key:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/temporal_worker_key
  temporal_reconciler_cert:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/temporal_reconciler_cert
  temporal_reconciler_key:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/temporal_reconciler_key
  temporal_namespace_bootstrap_cert:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/temporal_namespace_bootstrap_cert
  temporal_namespace_bootstrap_key:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/temporal_namespace_bootstrap_key
  temporal_diagnostics_cert:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/temporal_diagnostics_cert
  temporal_diagnostics_key:
    file: ${SECRETS_DIR:?SECRETS_DIR must name the private (0700) host secret directory}/temporal_diagnostics_key

networks:
  # Ingress is the only network that publishes a port (CloudFront's origin, port 80).
  # Every non-edge service network remains explicitly private.
  ingress: {}
  app:
    internal: true
  temporal-control:
    internal: true
  temporal-persistence:
    internal: true
