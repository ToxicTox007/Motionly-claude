[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motionly-api"
version = "0.1.0"
description = "FastAPI service for Motionly."
requires-python = ">=3.12"
dependencies = [
  "cryptography>=48.0.1,<49.0",
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "python-json-logger>=3.2.1",
  "redis>=5.2.1,<7.0",
  "temporalio==1.31.0",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
audio-ml = [
  "pyannote.audio>=3.3.2,<4.0",
  "tensorflow>=2.18.0,<2.19",
  "tensorflow-hub>=0.16.1",
  "torch>=2.5.0,<2.6",
  "torchaudio>=2.5.0,<2.6",
  "transformers>=4.48.0,<5.0",
]
# Task 27 music catalog analysis (duration, tempo, beat positions, energy).
# librosa pulls numba/llvmlite, which is too heavy for the API request-path
# image, so it is installed ONLY in the CPU worker image and the importer
# injects LibrosaAudioAnalyzer. Pinned to an exact version; the hash-locked
# pins land in requirements-ml.lock when it is regenerated with pip-compile
# (`pip-compile --allow-unsafe --extra=music-analysis ... --generate-hashes`).
# Never run the importer with an unpinned librosa.
music-analysis = [
  "librosa==0.10.2.post1",
  "soundfile>=0.12.1,<0.13",
  "numba>=0.60.0,<0.61",
]
demucs = [
  "demucs>=4.0.1",
  "torch>=2.5.0,<2.6",
  "torchaudio>=2.5.0,<2.6",
]
visual-ml = [
  "mediapipe>=0.10.18",
  # The hash-locked ML graph is NumPy 1.26.4, SciPy 1.17.1, and
  # scikit-learn 1.9.0. Keep the compatible major/minor window explicit.
  "numpy>=1.26.4,<2.0",
  "scipy>=1.17.1,<1.18",
  "scikit-learn>=1.9.0,<1.10",
  "opencv-python-headless>=4.10.0.84",
  "Pillow>=11.0.0",
  "ultralytics>=8.3.0",
  "torch>=2.5.0,<2.6",
  "transformers>=4.48.0,<5.0",
]
# GPU-free worker image (Dockerfile.python API_EXTRAS=cpu-vision): CPU MediaPipe
# matting/face detection, OpenCV scene/motion analysis, Pillow colour sampling
# and MediaPipe's TFLite YAMNet sound classifier. No torch, TensorFlow or
# transformers. Pins come from requirements-cpu-vision.lock, which is compiled
# with requirements-ml.lock as a constraint so versions match the GPU image.
cpu-vision = [
  "mediapipe>=0.10.18",
  "numpy>=1.26.4,<2.0",
  "opencv-python-headless>=4.10.0.84",
  "Pillow>=11.0.0",
]
dev = [
  "pytest>=8.3.4",
  "ruff>=0.8.4",
  "pip-licenses==5.0.0",
  # Dead-code detector for apps/api (Task 32 deadcode stage). Pinned exactly;
  # the whitelist of framework-called names lives in scripts/verify/vulture_whitelist.py.
  "vulture==2.16",
  # CPU-only media test dependencies: let the cv2 segmentation contract run in
  # the default suite. Versions are constrained to requirements-ml.lock.
  "numpy>=1.26.4,<2.0",
  "opencv-python-headless>=4.10.0.84",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "gpu_stage(id): needs real GPU hardware or GPU-stage infrastructure; runs only with RUN_GPU_STAGE_TESTS=1 and an id declared in tests/gpu-stage.json",
  "live_provider: contacts a real inference provider; skipped unless MOTIONLY_LIVE_INFERENCE=1, the only case the no-network test guard stands down",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
