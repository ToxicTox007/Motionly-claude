[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motionly-api"
version = "0.1.0"
description = "FastAPI service for Motionly."
requires-python = ">=3.12"
dependencies = [
  "cryptography>=48.0.1,<49.0",
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "python-json-logger>=3.2.1",
  "redis>=5.2.1,<7.0",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
audio-ml = [
  "pyannote.audio>=3.3.2,<4.0",
  "tensorflow>=2.18.0,<2.19",
  "tensorflow-hub>=0.16.1",
  "torch>=2.5.0,<2.6",
  "torchaudio>=2.5.0,<2.6",
  "transformers>=4.48.0,<5.0",
]
demucs = [
  "demucs>=4.0.1",
  "torch>=2.5.0,<2.6",
  "torchaudio>=2.5.0,<2.6",
]
visual-ml = [
  "mediapipe>=0.10.18",
  "numpy>=1.26.4,<2.0",
  "opencv-python-headless>=4.10.0.84",
  "Pillow>=11.0.0",
  "ultralytics>=8.3.0",
  "torch>=2.5.0,<2.6",
  "transformers>=4.48.0,<5.0",
]
dev = [
  "pytest>=8.3.4",
  "ruff>=0.8.4"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
